spring.application.name=banking-system
server.port=8787

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bankingdb?createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.banking=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT Configuration
app.jwtSecret=${JWT_SECRET:bankingSystemSecretKey}
app.jwtExpirationInMs=86400000